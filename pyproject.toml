[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyos"
version = "0.1.0.dev0"
description = "A local-first, auditable personal finance ledger"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MoneyOS contributors" }]
dependencies = []

[project.scripts]
moneyos = "moneyos.cli:main"

[tool.setuptools.packages.find]
include = ["moneyos*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
